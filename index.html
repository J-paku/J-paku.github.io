<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- テーマの先行反映。ThemeProvider(React)が立つ前にブートローダーと本文の初回ペイントが
         走るため、保存済みテーマをここで data-theme に反映しておかないとダーク選択者に
         ライトの地色が一瞬見える。localStorage の正本は src/lib/preferences.ts で、
         キー 'theme-preference' はそこと同値。変更時は両方を同時に更新する -->
    <script>
      try {
        if (localStorage.getItem('theme-preference') === 'dark') {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      } catch (e) {
        /* プライベートモード等は既定(ライト)のまま */
      }
    </script>
    <!-- 書体は Google Fonts から配信する。unicode-range で分割されているので、
         そのページで実際に描かれる符号位置のスライスだけが落ちてくる。
         data-fonts の値はロケール識別子で、scripts/emit-routes.mjs が /ko/ 用に差し替える。

         media="print" + onload で描画を止めない形にしている。素の <link> にすると
         このCSSの取得が終わるまで最初の描画が始まらない(実測: レンダーブロック 1170ms・
         FCP 2.0s→2.6s・Lighthouse性能 95→92)。display=swap なのでどちらにせよ本文は
         代替書体で先に出るため、止める意味が無い。
         JS 無効時の <noscript> フォールバックは置かない — このサイトはSPAで、JSが無ければ
         本文自体が描かれないため、書体だけ救っても意味が無い -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      data-fonts="ja"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@400&family=Playfair+Display:wght@400&display=swap"
    />
    <!-- 言語切替の『한국어』だけは Noto Sans JP にグリフが無く、置かないとシステムフォントで描かれる。
         text= で3文字だけを要求するので、この行の実体は 1KB に満たない -->
    <link
      rel="stylesheet"
      data-fonts-alt="ja"
      media="print"
      onload="this.media='all'"
      href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@500&text=%ED%95%9C%EA%B5%AD%EC%96%B4&display=swap"
    />
    <title>J-paku</title>
    <!-- ブートローダーの見た目。地色・文字色はトークン(var)参照なので、上の先行反映と合わせて
         ダーク選択時もローダーからダークで描かれる。バンドルCSS(トークン定義)は head の
         render-blocking な <link> なので、初回ペイント時点で var は必ず解決済み。
         書体スワップ(FOUT)はこのローダーが画面を覆っている間に終わらせる設計で、
         公開条件・上限は body 末尾の script が持つ -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        /* SettingsMenu(z-index:100)より上、dialog(top-layer)は起動中に開かないので対象外 */
        z-index: 200;
        display: grid;
        place-items: center;
        background: var(--ground);
        transition: opacity var(--motion-slow) var(--ease-reveal);
      }
      #boot[data-done] {
        opacity: 0;
        pointer-events: none;
      }
      #boot svg {
        width: clamp(150px, 32vw, 240px);
        height: auto;
        overflow: visible;
      }
      /* Playfair Display 400 の字形をパス化したもの(下のSVG)。pathLength=1 に正規化してあるので
         dasharray/dashoffset は文字ごとの実長に依存しない。1文字ずつ 80ms ずらして輪郭を描き、
         描き終わりに合わせて塗りを入れる。全6文字で約1.1sに収まる */
      #boot path {
        --boot-i: 0;
        fill: var(--ink);
        fill-opacity: 0;
        stroke: var(--ink);
        stroke-width: 1;
        stroke-dasharray: 1;
        stroke-dashoffset: 1;
        animation:
          boot-draw 0.4s var(--ease-reveal) forwards,
          boot-fill 0.35s ease forwards;
        animation-delay: calc(var(--boot-i) * 80ms), calc(var(--boot-i) * 80ms + 320ms);
      }
      #boot path:nth-of-type(2) { --boot-i: 1; }
      #boot path:nth-of-type(3) { --boot-i: 2; }
      #boot path:nth-of-type(4) { --boot-i: 3; }
      #boot path:nth-of-type(5) { --boot-i: 4; }
      #boot path:nth-of-type(6) { --boot-i: 5; }
      @keyframes boot-draw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes boot-fill {
        to { fill-opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot {
          transition: none;
        }
        #boot path {
          animation: none;
          fill-opacity: 1;
          stroke-dashoffset: 0;
        }
      }
    </style>
    <!-- アクセス解析(GoatCounter)。Cookie 不使用。初回表示はこのタグが自動で送り、
         以降のルート遷移は src/hooks/use-pageview-tracking.ts から送る -->
    <script data-goatcounter="https://tottannim.goatcounter.com/count" async src="https://gc.zgo.at/count.js"></script>
  </head>

    <noscript>
      <!-- JS無しではアプリ本体が描かれないが、ローダーだけ永久に残るのは避ける -->
      <style>
        #boot { display: none; }
      </style>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- ローダーの公開制御。公開条件 = React マウント(#root に子が入る) + document.fonts.ready。
         描画アニメ(約1.1s)完走までは最低保持し、どんな回線でも 2s で無条件公開する。
         reduced-motion 時はアニメが無いので最低保持もしない -->
    <script>
      ;(function () {
        var boot = document.getElementById('boot')
        if (boot === null) return
        var t0 = Date.now()
        var MIN = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1100
        var CAP = 2000
        var done = false
        var reveal = function () {
          if (done) return
          done = true
          boot.setAttribute('data-done', '')
          window.setTimeout(function () { boot.remove() }, 500)
        }
        var finish = function () {
          var rest = MIN - (Date.now() - t0)
          if (rest > 0) window.setTimeout(reveal, rest)
          else reveal()
        }
        window.setTimeout(reveal, CAP)
        /* fonts.ready は「その時点で読み込み中のものが無い」だけで解決するため、
           本文描画がグリフ由来の取得を発行する前に見ると素通りする(実測: 低速回線で
           status=loading のまま公開された)。マウント後2フレーム置いてから、
           status が loading の間は ready を取り直して回る。上限は上の CAP が担う */
        var waitFonts = function () {
          if (document.fonts.status === 'loading') {
            document.fonts.ready.then(function () {
              window.requestAnimationFrame(waitFonts)
            }, finish)
          } else {
            finish()
          }
        }
        /* 書体CSSは media=print で読み、onload で all に切り替わる(head 参照)。
           切り替わる前は @font-face 自体が無く fonts.status が当てにならないため、
           「マウント済み + 書体CSS適用済み」まで待ってから status を見る。
           CSSが落ちてこない場合は CAP が公開する */
        var root = document.getElementById('root')
        var fontCss = document.querySelector('link[data-fonts]')
        var poll = function () {
          var mounted = root !== null && root.childElementCount > 0
          var cssApplied = fontCss === null || fontCss.media === 'all'
          if (mounted && cssApplied) {
            window.requestAnimationFrame(function () {
              window.requestAnimationFrame(waitFonts)
            })
          } else {
            window.requestAnimationFrame(poll)
          }
        }
        window.requestAnimationFrame(poll)
      })()
    </script>
