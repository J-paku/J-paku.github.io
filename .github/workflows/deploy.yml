name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# 最上位は読むだけ。buildジョブは依存の更新PRが入れる新しいパッケージのnpm ciを走らせるので、配信の権限を持たせない
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      # 前段が落ちたら後段を走らせる意味が無いので直列
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      # カバレッジが床を下回ったらここで止まる(基準の正本はvitest.config.tsのcoverage.thresholds)
      - run: npm run test:coverage
      - run: npm run test:boundary
      # ブラウザ本体は lock ファイルの版ごとに使い回す。OS 側の依存はキャッシュできないので hit でも入れる。
      # 統合テスト(Vitest Browser Mode)も Chromium を使うので、その前に入れる
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}
      - name: Install Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      # 統合テスト。ビルド無しで実ブラウザに画面を描く。カバレッジが床を下回ったらここで止まる(基準の正本はvitest.integration.config.tsのcoverage.thresholds)
      - run: npm run test:integration -- --coverage
      # 変異テストは前回の結果(stryker.config.mjs の incrementalFile)を引き継ぎ、変わった変異体だけを走らせる。
      # 鍵に依存・設定の指紋を入れず、いつも最も新しく保存された結果を戻す。依存・設定が変わっても全部は走らせない
      # (全部を測り直すのは手で走らせる --force。docs/decisions/0023-inherit-latest-mutation-result.md)。
      # キャッシュがまだ無い最初の push では、引き継ぐ結果が無いので全部が走る
      # 結果の隣の stryker-incremental.test-deps.json は、テストごとに import をたどって届くファイルの指紋。結果と一緒に持ち回り、
      # 届くファイルが変わったテストが前回落とした変異体を測り直す(無ければ前回落とした変異体を全部測り直す。
      # scripts/run-mutation.mjs・docs/decisions/0025-remeasure-kills-on-test-deps.md)
      # path を変えた後の最初の push も全部が走る。actions/cache は path の並び(と圧縮の方法)からキャッシュの version を作り、
      # version の違うキャッシュは鍵が合っても restore-keys でも戻さない。0025 で path に指紋のファイルを足したので、それより前に
      # 保存した結果(鍵に依存・設定の指紋を入れていた頃の stryker-incremental-<指紋>-<sha> も)は戻らない
      - name: Restore Stryker incremental result
        uses: actions/cache/restore@v6
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.test-deps.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: stryker-incremental-
      - run: npm run test:mutation
      # 変異テストが落ちても結果は残して次の push を速くする。取り消された実行は保存しない
      - name: Save Stryker incremental result
        if: ${{ !cancelled() && hashFiles('reports/stryker-incremental.json') != '' }}
        uses: actions/cache/save@v6
        with:
          path: |
            reports/stryker-incremental.json
            reports/stryker-incremental.test-deps.json
          key: stryker-incremental-${{ github.sha }}
      # 計測先 URL はリポジトリに書かず、GitHub の変数から渡す(未設定なら計測タグを出さない)
      - name: Build
        run: npm run build
        env:
          NEXT_PUBLIC_GOATCOUNTER_URL: ${{ vars.GOATCOUNTER_URL }}
      - run: npm run test:e2e
      - name: Start static server
        run: npx serve out -l 4173 &
      - run: npx wait-on http://localhost:4173
      - name: axe accessibility check
        run: node scripts/check-a11y.mjs http://localhost:4173 / /ko/ /list/ /ko/list/ /works/meishi-cross-platform/ /ko/works/meishi-cross-platform/
      # 測る先は前段が:4173で上げた配信をそのまま使う(経路と基準の正本はlighthouserc.json)。
      # 基準の根拠はdocs/quality/performance.md。報告は外へ上げない(uploadを設定しない)
      - name: Lighthouse CI
        run: npx -y @lhci/cli@0.15.1 collect && npx -y @lhci/cli@0.15.1 assert
      # apt のアーカイブ(/var/cache/apt)は root 所有で cache アクションが復元できないので、.deb を利用者側に落として持ち回る
      - name: Cache CJK font package
        id: fonts-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/apt-fonts
          key: ${{ runner.os }}-fonts-noto-cjk-v1
      - name: Download CJK font package
        if: steps.fonts-cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          mkdir -p ~/.cache/apt-fonts && (cd ~/.cache/apt-fonts && apt-get download fonts-noto-cjk)
      - name: Install CJK fonts for measurement
        # dpkg は依存を解決しないので、失敗したら apt で不足分を入れて仕上げる
        run: sudo dpkg -i ~/.cache/apt-fonts/*.deb || sudo apt-get install -f -y
      - name: Japanese line-break check
        run: node scripts/check-ja-linebreak.mjs http://localhost:4173 / /ko/ /list/ /ko/list/ /works/meishi-cross-platform/ /ko/works/meishi-cross-platform/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: out

  deploy:
    needs: build
    # 配信の権限はこのジョブにだけ渡す
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # 配信の準備もPagesの権限が要るので、buildジョブではなくここで行う
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
