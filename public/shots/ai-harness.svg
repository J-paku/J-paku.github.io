<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!--
    AIエージェント開発環境(ハーネス) の作品カード用サムネイル。
    構図 = AIオーケストレーション図の定石である放射型サイクル:
    中央ハブ(AI + スターバースト) → 衛星ノード5つ(このハーネスの実サイクル:
    プロンプト → worktree 並列ディスパッチ → ツール実行 → 検証ゲート → 収束) → 循環矢印。
    「AI」はフォント依存を避けストロークのパスで直接描く。スターバーストは多放射の
    アスタリスク形(4点スパークルは使わない)。
    カードは平常 grayscale で表示されるため、判別は色相ではなく明度と形が担う。
  -->
  <defs>
    <!-- JSONLトレース行(背景の質感)。1タイル = ログ2行 -->
    <pattern id="trace" width="520" height="128" patternUnits="userSpaceOnUse">
      <rect x="0" y="10" width="12" height="12" rx="3" fill="#d9d3c7" />
      <rect x="22" y="10" width="150" height="12" rx="6" fill="#e2ded4" />
      <rect x="182" y="10" width="70" height="12" rx="6" fill="#d9d3c7" />
      <rect x="262" y="10" width="110" height="12" rx="6" fill="#e2ded4" />
      <rect x="382" y="10" width="56" height="12" rx="6" fill="#d9d3c7" />
      <rect x="40" y="74" width="12" height="12" rx="3" fill="#d9d3c7" />
      <rect x="62" y="74" width="120" height="12" rx="6" fill="#e2ded4" />
      <rect x="192" y="74" width="180" height="12" rx="6" fill="#d9d3c7" />
      <rect x="382" y="74" width="90" height="12" rx="6" fill="#e2ded4" />
    </pattern>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#2b2a26" flood-opacity="0.22" />
    </filter>
    <!-- 循環矢印の矢先 -->
    <marker id="arrow" viewBox="0 0 10 10" refX="6.5" refY="5" markerWidth="4.6" markerHeight="4.6" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 Z" fill="#c9755f" />
    </marker>
    <!-- スターバースト(多放射アスタリスク)。fill/stroke は use 側で指定 -->
    <g id="burst" fill="none" stroke-linecap="round">
      <path d="M0 -16 L0 -34" />
      <path d="M9.4 -12.9 L20 -27.5" />
      <path d="M15.2 -4.9 L32.3 -10.5" />
      <path d="M15.2 4.9 L32.3 10.5" />
      <path d="M9.4 12.9 L20 27.5" />
      <path d="M0 16 L0 34" />
      <path d="M-9.4 12.9 L-20 27.5" />
      <path d="M-15.2 4.9 L-32.3 10.5" />
      <path d="M-15.2 -4.9 L-32.3 -10.5" />
      <path d="M-9.4 -12.9 L-20 -27.5" />
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#f4f1ec" />
  <rect width="1600" height="1200" fill="url(#trace)" />
  <rect width="1600" height="1200" fill="#f4f1ec" opacity="0.55" />

  <!-- ===== 循環矢印(軌道半径380・ノードの手前で切る) ===== -->
  <g fill="none" stroke="#c9755f" stroke-width="9" stroke-linecap="round">
    <path d="M936 245 A380 380 0 0 1 1095 361" marker-end="url(#arrow)" />
    <path d="M1180 620 A380 380 0 0 1 1119 807" marker-end="url(#arrow)" />
    <path d="M898 967 A380 380 0 0 1 702 967" marker-end="url(#arrow)" />
    <path d="M481 807 A380 380 0 0 1 420 620" marker-end="url(#arrow)" />
    <path d="M505 361 A380 380 0 0 1 664 245" marker-end="url(#arrow)" />
  </g>

  <!-- ===== 中央ハブ: AI ===== -->
  <g filter="url(#lift)">
    <circle cx="800" cy="600" r="200" fill="#23262b" />
  </g>
  <!-- "AI" をストロークのパスで描く(A + セリフ付き I) -->
  <g fill="none" stroke="#f4f1ec" stroke-width="26" stroke-linecap="round" stroke-linejoin="round">
    <path d="M712 678 L764 522 L816 678" />
    <path d="M733 622 L795 622" />
    <path d="M872 528 L872 672" />
    <path d="M848 528 L896 528" />
    <path d="M848 672 L896 672" />
  </g>
  <use href="#burst" transform="translate(908 478) scale(0.92)" stroke="#c9755f" stroke-width="9" />

  <!-- ===== 衛星ノード5つ(ハーネスの実サイクル) ===== -->
  <!-- 1. プロンプト(チャットバブル) : 上 -->
  <g filter="url(#lift)">
    <circle cx="800" cy="220" r="95" fill="#23262b" />
  </g>
  <g fill="none" stroke="#f4f1ec" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M757 185 h86 a12 12 0 0 1 12 12 v40 a12 12 0 0 1 -12 12 h-52 l-22 18 v-18 h-12 a12 12 0 0 1 -12 -12 v-40 a12 12 0 0 1 12 -12 Z" />
    <path d="M772 210 L828 210" />
    <path d="M772 230 L810 230" />
  </g>

  <!-- 2. worktree 並列ディスパッチ(ブランチ) : 右上 -->
  <g filter="url(#lift)">
    <circle cx="1161" cy="483" r="95" fill="#23262b" />
  </g>
  <g fill="none" stroke="#f4f1ec" stroke-width="8" stroke-linecap="round">
    <path d="M1141 448 L1141 518" />
    <path d="M1141 488 C1141 458 1186 470 1186 442" />
    <circle cx="1141" cy="448" r="11" fill="#23262b" />
    <circle cx="1141" cy="518" r="11" fill="#23262b" />
    <circle cx="1186" cy="442" r="11" fill="#23262b" stroke="#c9755f" />
  </g>

  <!-- 3. ツール実行(ターミナル) : 右下 -->
  <g filter="url(#lift)">
    <circle cx="1023" cy="907" r="95" fill="#23262b" />
  </g>
  <g fill="none" stroke="#f4f1ec" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <rect x="978" y="872" width="90" height="70" rx="10" />
    <path d="M994 894 L1010 907 L994 920" />
    <path d="M1022 922 L1046 922" />
  </g>

  <!-- 4. 検証ゲート(二重シェブロン) : 左下 -->
  <g filter="url(#lift)">
    <circle cx="577" cy="907" r="95" fill="#23262b" />
  </g>
  <g fill="none" stroke="#f4f1ec" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
    <rect x="537" y="869" width="80" height="76" rx="24" />
    <path d="M559 890 L577 906 L595 890" stroke="#c9755f" />
    <path d="M559 914 L577 930 L595 914" stroke="#c9755f" />
  </g>

  <!-- 5. 収束・検証通過(チェック) : 左上 -->
  <g filter="url(#lift)">
    <circle cx="439" cy="483" r="95" fill="#23262b" />
  </g>
  <path d="M403 483 L428 510 L479 452" fill="none" stroke="#c9755f" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" />
</svg>
