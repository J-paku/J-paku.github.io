<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!--
    AIエージェント開発環境(ハーネス) の作品カード用サムネイル。文字は一切置かない図解。
    背景 = JSONLトレース行と worktree ブランチ、前面 = fan-out 実行フロー
    (オーケストレーター → ワーカー3並列 → フックゲート → 収束・検証通過)。
    カードは平常 grayscale で表示されるため、判別は色相ではなく明度と形が担う。
  -->
  <defs>
    <!-- JSONLトレース行。1タイル = ログ2行(先頭の角丸小片がタイムスタンプ相当) -->
    <pattern id="trace" width="520" height="128" patternUnits="userSpaceOnUse">
      <rect x="0" y="10" width="12" height="12" rx="3" fill="#d9d3c7" />
      <rect x="22" y="10" width="150" height="12" rx="6" fill="#e2ded4" />
      <rect x="182" y="10" width="70" height="12" rx="6" fill="#d9d3c7" />
      <rect x="262" y="10" width="110" height="12" rx="6" fill="#e2ded4" />
      <rect x="382" y="10" width="56" height="12" rx="6" fill="#d9d3c7" />
      <rect x="40" y="74" width="12" height="12" rx="3" fill="#d9d3c7" />
      <rect x="62" y="74" width="120" height="12" rx="6" fill="#e2ded4" />
      <rect x="192" y="74" width="180" height="12" rx="6" fill="#d9d3c7" />
      <rect x="382" y="74" width="90" height="12" rx="6" fill="#e2ded4" />
    </pattern>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#2b2a26" flood-opacity="0.22" />
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9755f" />
      <stop offset="1" stop-color="#a5563f" />
    </linearGradient>

    <!-- diff の1行。追加 = 明 / 削除 = やや暗。grayscale では左端の見出し色と地の明度差で判別 -->
    <g id="rAdd">
      <rect width="332" height="22" rx="5" fill="#e2eed8" />
      <rect width="8" height="22" rx="3" fill="#57a06b" />
    </g>
    <g id="rDel">
      <rect width="332" height="22" rx="5" fill="#ecc9bf" />
      <rect width="8" height="22" rx="3" fill="#b45c3a" />
    </g>
    <g id="rCtx">
      <rect width="332" height="22" rx="5" fill="#f4f2ee" />
    </g>

    <!-- worktree ブランチ(ワーカー窓のタイトルバー用) -->
    <g id="branch">
      <path d="M6 22 L6 6" stroke="#8a857c" stroke-width="3" stroke-linecap="round" fill="none" />
      <path d="M6 16 C6 9 13 8 19 6" stroke="#8a857c" stroke-width="3" stroke-linecap="round" fill="none" />
      <circle cx="6" cy="22" r="4.5" fill="#4a4740" />
      <circle cx="6" cy="6" r="4.5" fill="#4a4740" />
      <circle cx="21" cy="5" r="4.5" fill="#c9755f" />
    </g>
  </defs>

  <rect width="1600" height="1200" fill="#f4f1ec" />
  <rect width="1600" height="1200" fill="url(#trace)" />

  <!-- ===== 背景: worktree のブランチグラフ ===== -->
  <g fill="none" stroke="#ddd6c8" stroke-width="5">
    <path d="M0 140 H1600" />
    <path d="M320 140 C440 140 440 230 560 230 H1180 C1300 230 1300 140 1420 140" />
    <path d="M0 1060 H480" />
  </g>
  <g fill="#f4f1ec" stroke="#d9d3c7" stroke-width="4">
    <circle cx="320" cy="140" r="9" />
    <circle cx="560" cy="230" r="9" />
    <circle cx="880" cy="230" r="9" />
    <circle cx="1180" cy="230" r="9" />
    <circle cx="1420" cy="140" r="9" />
    <circle cx="240" cy="1060" r="9" />
  </g>

  <!-- 前面のフローを立たせるため、背景全体を紙色で一段沈める -->
  <rect width="1600" height="1200" fill="#f4f1ec" opacity="0.42" />

  <!-- ===== 接続線(窓より先に描き、端点は窓の下に隠す) ===== -->
  <g fill="none" stroke="#4a4740" stroke-width="7" stroke-linecap="round">
    <!-- オーケストレーター → ワーカー3列 -->
    <path d="M800 360 L800 392 Q800 400 792 400 L308 400 Q300 400 300 408 L300 466" />
    <path d="M800 360 L800 466" />
    <path d="M800 360 L800 392 Q800 400 808 400 L1292 400 Q1300 400 1300 408 L1300 466" />
    <!-- ワーカー → ゲート開口部 -->
    <path d="M300 800 L300 866" />
    <path d="M800 800 L800 866" />
    <path d="M1300 800 L1300 866" />
    <!-- ゲート通過後 → 収束パネル -->
    <path d="M300 946 L300 962 Q300 970 308 970 L672 970 Q680 970 680 978 L680 1004" />
    <path d="M800 946 L800 1004" />
    <path d="M1300 946 L1300 962 Q1300 970 1292 970 L928 970 Q920 970 920 978 L920 1004" />
  </g>
  <circle cx="800" cy="360" r="10" fill="#23262b" />
  <path d="M292 452 L308 452 L300 468 z" fill="#4a4740" />
  <path d="M792 452 L808 452 L800 468 z" fill="#4a4740" />
  <path d="M1292 452 L1308 452 L1300 468 z" fill="#4a4740" />

  <!-- ===== オーケストレーター(暗色ターミナル) ===== -->
  <g filter="url(#lift)">
    <rect x="460" y="90" width="680" height="270" rx="20" fill="#23262b" />
  </g>
  <rect x="462" y="92" width="676" height="44" rx="18" fill="#1b1d21" />
  <rect x="462" y="116" width="676" height="20" fill="#1b1d21" />
  <circle cx="492" cy="114" r="8" fill="#e0685c" />
  <circle cx="522" cy="114" r="8" fill="#e8b93e" />
  <circle cx="552" cy="114" r="8" fill="#57b269" />
  <!-- プロンプト行。先頭の赤茶片がコマンド記号相当、最終行の明るい角片がカーソル -->
  <rect x="496" y="150" width="14" height="14" rx="3" fill="#c9755f" />
  <rect x="520" y="150" width="300" height="14" rx="7" fill="#d7d3ca" />
  <rect x="496" y="180" width="420" height="12" rx="6" fill="#9a968e" />
  <rect x="496" y="204" width="360" height="12" rx="6" fill="#6b6862" />
  <rect x="496" y="228" width="440" height="12" rx="6" fill="#9a968e" />
  <rect x="496" y="252" width="260" height="14" rx="7" fill="#c9755f" />
  <rect x="496" y="282" width="120" height="12" rx="6" fill="#9a968e" />
  <rect x="628" y="279" width="16" height="18" rx="2" fill="#f4f1ec" />
  <!-- 右列: ディスパッチ済みワーカーの状態チップ3つ -->
  <rect x="980" y="150" width="120" height="24" rx="12" fill="#2f3238" />
  <circle cx="996" cy="162" r="6" fill="#57b269" />
  <rect x="1010" y="157" width="74" height="10" rx="5" fill="#8a8d94" />
  <rect x="980" y="186" width="120" height="24" rx="12" fill="#2f3238" />
  <circle cx="996" cy="198" r="6" fill="#e8b93e" />
  <rect x="1010" y="193" width="74" height="10" rx="5" fill="#8a8d94" />
  <rect x="980" y="222" width="120" height="24" rx="12" fill="#2f3238" />
  <circle cx="996" cy="234" r="6" fill="#9a968e" />
  <rect x="1010" y="229" width="74" height="10" rx="5" fill="#8a8d94" />

  <!-- ===== ワーカー窓3列(白ターミナル + diff 行 + worktree ブランチ) ===== -->
  <!-- A -->
  <g filter="url(#lift)">
    <rect x="110" y="470" width="380" height="330" rx="18" fill="#ffffff" stroke="#ddd8cf" stroke-width="2.5" />
  </g>
  <rect x="112" y="472" width="376" height="40" rx="16" fill="#f2f0ec" />
  <rect x="112" y="492" width="376" height="20" fill="#f2f0ec" />
  <use href="#branch" x="128" y="478" />
  <rect x="260" y="487" width="90" height="10" rx="5" fill="#c6c2ba" />
  <use href="#rAdd" x="134" y="530" /><rect x="174" y="537" width="180" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rAdd" x="134" y="560" /><rect x="174" y="567" width="130" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rCtx" x="134" y="590" /><rect x="174" y="597" width="160" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rDel" x="134" y="620" /><rect x="174" y="627" width="150" height="8" rx="4" fill="#c99a88" />
  <use href="#rAdd" x="134" y="650" /><rect x="174" y="657" width="200" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rCtx" x="134" y="680" /><rect x="174" y="687" width="120" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rAdd" x="134" y="710" /><rect x="174" y="717" width="170" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rAdd" x="134" y="740" /><rect x="174" y="747" width="110" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rDel" x="134" y="770" /><rect x="174" y="777" width="140" height="8" rx="4" fill="#c99a88" />
  <!-- B -->
  <g filter="url(#lift)">
    <rect x="610" y="470" width="380" height="330" rx="18" fill="#ffffff" stroke="#ddd8cf" stroke-width="2.5" />
  </g>
  <rect x="612" y="472" width="376" height="40" rx="16" fill="#f2f0ec" />
  <rect x="612" y="492" width="376" height="20" fill="#f2f0ec" />
  <use href="#branch" x="628" y="478" />
  <rect x="760" y="487" width="90" height="10" rx="5" fill="#c6c2ba" />
  <use href="#rCtx" x="634" y="530" /><rect x="674" y="537" width="140" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rAdd" x="634" y="560" /><rect x="674" y="567" width="190" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rDel" x="634" y="590" /><rect x="674" y="597" width="120" height="8" rx="4" fill="#c99a88" />
  <use href="#rDel" x="634" y="620" /><rect x="674" y="627" width="160" height="8" rx="4" fill="#c99a88" />
  <use href="#rAdd" x="634" y="650" /><rect x="674" y="657" width="210" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rAdd" x="634" y="680" /><rect x="674" y="687" width="150" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rCtx" x="634" y="710" /><rect x="674" y="717" width="170" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rAdd" x="634" y="740" /><rect x="674" y="747" width="100" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rCtx" x="634" y="770" /><rect x="674" y="777" width="130" height="8" rx="4" fill="#c6c2ba" />
  <!-- C -->
  <g filter="url(#lift)">
    <rect x="1110" y="470" width="380" height="330" rx="18" fill="#ffffff" stroke="#ddd8cf" stroke-width="2.5" />
  </g>
  <rect x="1112" y="472" width="376" height="40" rx="16" fill="#f2f0ec" />
  <rect x="1112" y="492" width="376" height="20" fill="#f2f0ec" />
  <use href="#branch" x="1128" y="478" />
  <rect x="1260" y="487" width="90" height="10" rx="5" fill="#c6c2ba" />
  <use href="#rAdd" x="1134" y="530" /><rect x="1174" y="537" width="160" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rCtx" x="1134" y="560" /><rect x="1174" y="567" width="120" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rAdd" x="1134" y="590" /><rect x="1174" y="597" width="200" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rAdd" x="1134" y="620" /><rect x="1174" y="627" width="140" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rDel" x="1134" y="650" /><rect x="1174" y="657" width="170" height="8" rx="4" fill="#c99a88" />
  <use href="#rCtx" x="1134" y="680" /><rect x="1174" y="687" width="150" height="8" rx="4" fill="#c6c2ba" />
  <use href="#rAdd" x="1134" y="710" /><rect x="1174" y="717" width="180" height="8" rx="4" fill="#b3c9a4" />
  <use href="#rDel" x="1134" y="740" /><rect x="1174" y="747" width="110" height="8" rx="4" fill="#c99a88" />
  <use href="#rAdd" x="1134" y="770" /><rect x="1174" y="777" width="190" height="8" rx="4" fill="#b3c9a4" />

  <!-- ===== フックゲート帯(通過口は3つだけ) ===== -->
  <rect x="0" y="850" width="1600" height="96" fill="url(#band)" />
  <rect x="0" y="850" width="1600" height="4" fill="#8a4632" opacity="0.6" />
  <rect x="0" y="942" width="1600" height="4" fill="#8a4632" opacity="0.6" />
  <g fill="#ffffff" opacity="0.3">
    <circle cx="60" cy="898" r="4" /><circle cx="110" cy="898" r="4" /><circle cx="160" cy="898" r="4" />
    <circle cx="400" cy="898" r="4" /><circle cx="450" cy="898" r="4" /><circle cx="500" cy="898" r="4" />
    <circle cx="550" cy="898" r="4" /><circle cx="600" cy="898" r="4" /><circle cx="650" cy="898" r="4" />
    <circle cx="950" cy="898" r="4" /><circle cx="1000" cy="898" r="4" /><circle cx="1050" cy="898" r="4" />
    <circle cx="1100" cy="898" r="4" /><circle cx="1150" cy="898" r="4" /><circle cx="1200" cy="898" r="4" />
    <circle cx="1440" cy="898" r="4" /><circle cx="1490" cy="898" r="4" /><circle cx="1540" cy="898" r="4" />
  </g>
  <g>
    <rect x="240" y="866" width="120" height="64" rx="32" fill="#f4f1ec" stroke="#ffffff" stroke-width="3" />
    <rect x="740" y="866" width="120" height="64" rx="32" fill="#f4f1ec" stroke="#ffffff" stroke-width="3" />
    <rect x="1240" y="866" width="120" height="64" rx="32" fill="#f4f1ec" stroke="#ffffff" stroke-width="3" />
  </g>
  <g fill="none" stroke="#a5563f" stroke-width="6" stroke-linecap="round" stroke-linejoin="round">
    <path d="M287 878 L300 890 L313 878" />
    <path d="M287 896 L300 908 L313 896" />
    <path d="M787 878 L800 890 L813 878" />
    <path d="M787 896 L800 908 L813 896" />
    <path d="M1287 878 L1300 890 L1313 878" />
    <path d="M1287 896 L1300 908 L1313 896" />
  </g>

  <!-- ===== 収束パネル(検証3件通過) ===== -->
  <g filter="url(#lift)">
    <rect x="520" y="1000" width="560" height="140" rx="18" fill="#ffffff" stroke="#ddd8cf" stroke-width="2.5" />
  </g>
  <g>
    <circle cx="660" cy="1058" r="34" fill="#eef2ea" stroke="#d8e0d2" stroke-width="2.5" />
    <circle cx="800" cy="1058" r="34" fill="#eef2ea" stroke="#d8e0d2" stroke-width="2.5" />
    <circle cx="940" cy="1058" r="34" fill="#eef2ea" stroke="#d8e0d2" stroke-width="2.5" />
  </g>
  <g fill="none" stroke="#2f8f5b" stroke-width="8" stroke-linecap="round" stroke-linejoin="round">
    <path d="M646 1058 L656 1069 L676 1047" />
    <path d="M786 1058 L796 1069 L816 1047" />
    <path d="M926 1058 L936 1069 L956 1047" />
  </g>
  <rect x="630" y="1108" width="60" height="8" rx="4" fill="#d2cec5" />
  <rect x="770" y="1108" width="60" height="8" rx="4" fill="#d2cec5" />
  <rect x="910" y="1108" width="60" height="8" rx="4" fill="#d2cec5" />
</svg>
