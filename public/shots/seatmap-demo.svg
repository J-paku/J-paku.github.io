    <g id="cell">
      <rect x="46" y="0" width="118" height="17" rx="8.5" style="fill:var(--barA,#2f8a68)" opacity="0.55" />
      <rect x="72" y="27" width="66" height="12" rx="6" style="fill:var(--barB,#8fae9f)" />
