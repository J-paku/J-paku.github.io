<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1200" width="1600" height="1200">
  <!--
    座席マップデモ の作品カード用サムネイル。文字は一切置かない図解。
    背景 = 拠点全体の座席平面図、前面 = 主要3画面(座席マップ / 社員一覧 / 社員詳細)。
    カードは平常 grayscale で表示されるため、判別は色相ではなく明度と形が担う。
  -->
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="4" cy="4" r="1.8" fill="#d9d3c7" />
    </pattern>
    <pattern id="dotsS" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#e2ded4" />
    </pattern>
    <filter id="lift" x="-30%" y="-20%" width="160%" height="150%">
      <feDropShadow dx="0" dy="20" stdDeviation="22" flood-color="#2b2a26" flood-opacity="0.22" />
    </filter>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#c9755f" />
      <stop offset="1" stop-color="#a5563f" />
    </linearGradient>

    <clipPath id="clipA"><rect x="143" y="513" width="314" height="624" rx="25" /></clipPath>
    <clipPath id="clipB"><rect x="613" y="383" width="374" height="754" rx="25" /></clipPath>
    <clipPath id="clipC"><rect x="1143" y="473" width="324" height="664" rx="25" /></clipPath>

    <!-- 座席1つ分のタイル。アバター色と在席状態の色は use 側の style で差し替える -->
    <g id="seat">
      <rect width="66" height="84" rx="8" fill="#ffffff" stroke="#e4e0d7" stroke-width="1.5" />
      <rect x="19" y="7" width="28" height="28" rx="4" style="fill:var(--av,#7a8b9e)" />
      <rect x="23" y="14" width="20" height="15" rx="2" fill="#f6e7cf" />
      <rect x="23" y="10" width="20" height="6" rx="1" fill="#3c3730" />
      <rect x="12" y="43" width="42" height="7" rx="3.5" fill="#4a4740" />
      <rect x="15" y="54" width="36" height="6" rx="3" fill="#bab6ad" />
      <circle cx="20" cy="70" r="4.5" style="fill:var(--st,#3f9e6a)" />
      <rect x="29" y="66" width="26" height="7" rx="3.5" fill="#d2cec5" />
    </g>

    <!-- 社員一覧の1行 -->
