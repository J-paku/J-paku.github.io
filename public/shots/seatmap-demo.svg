      <rect x="12" width="350" height="80" rx="10" fill="#ffffff" stroke="#e8e4dc" stroke-width="1.5" />
      <rect x="26" y="14" width="52" height="52" rx="6" style="fill:var(--av,#7a8b9e)" />
      <rect x="32" y="27" width="40" height="27" rx="3" fill="#f6e7cf" />
      <rect x="32" y="21" width="40" height="9" rx="2" fill="#3c3730" />
      <rect x="92" y="18" width="118" height="14" rx="7" fill="#2b2b28" />
      <rect x="92" y="38" width="66" height="11" rx="5.5" style="fill:var(--role,#c9c5bc)" />
      <rect x="92" y="55" width="98" height="10" rx="5" fill="#bab6ad" />
      <path d="M330 26 l4.4 9 9.9 1.4 -7.2 7 1.7 9.9 -8.8 -4.7 -8.8 4.7 1.7 -9.9 -7.2 -7 9.9 -1.4 z"
            style="fill:var(--star,#dcd7cd)" />
    </g>

    <!-- 部署ブロックのラベル札(左:名前 / 右:人数 の2色) -->
    <g id="tag">
      <rect x="2" y="2" width="226" height="58" rx="4" fill="#fdfdfc" stroke="#1a1a18" stroke-width="4" />
      <rect x="150" y="4" width="76" height="54" style="fill:var(--tone,#cf6a52)" />
      <rect x="150" y="4" width="76" height="54" fill="none" stroke="#1a1a18" stroke-width="4" />
      <rect x="26" y="22" width="98" height="16" rx="3" fill="#26241f" />
      <rect x="166" y="24" width="44" height="14" rx="3" fill="#ffffff" />
    </g>

