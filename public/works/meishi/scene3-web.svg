<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif">
  <!-- 名刺管理(Web管理画面)一覧: 検索バー→一覧行が順に出現するループ -->
  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <filter id="thumbShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity=".18"/>
    </filter>
    <!-- J-Paku ロゴ(自社ブランド) -->
    <g id="jpakuLogo">
      <g transform="translate(91.53 36.13) scale(.714)">
        <g>
          <rect x="-14.3" y="21.5" width="170" height="170" rx="42" fill="#C76A4A"/>
          <g fill="#FFF7F1">
            <rect x="16" y="56" width="46" height="34" rx="10"/>
            <rect x="78" y="56" width="46" height="34" rx="10"/>
            <rect x="16" y="122" width="46" height="34" rx="10"/>
            <rect x="78" y="122" width="46" height="34" rx="10"/>
          </g>
          <rect x="16" y="102" width="108" height="8" rx="4" fill="#FFF7F1" opacity="0.45"/>
        </g>
        <text x="186" y="106.5" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif"
              font-size="106" font-weight="700" letter-spacing="-2"
              fill="#2A2522" dominant-baseline="central">J-Paku</text>
      </g>
    </g>
    <!-- 一覧サムネイル用ダミー名刺(縮小・架空) -->
    <g id="thumbCard1">
      <rect x="0" y="0" width="112" height="68" rx="6" fill="#fff"/>
      <rect x="0" y="63" width="112" height="5" fill="#4A5FC1"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#1a2b4a">株式会社サンプル</text>
      <text x="8" y="40" font-size="11" font-weight="700" letter-spacing="1.5" fill="#111">山田 太郎</text>
      <rect x="62" y="47" width="42" height="2.5" fill="#bbb"/><rect x="62" y="52" width="42" height="2.5" fill="#bbb"/>
    </g>
    <g id="thumbCard2">
      <rect x="0" y="0" width="112" height="68" rx="6" fill="#fff"/>
      <rect x="0" y="0" width="112" height="6" fill="#2F855A"/>
      <rect x="8" y="14" width="50" height="3" fill="#9aa"/>
      <text x="8" y="40" font-size="11" font-weight="700" fill="#222">鈴木 花子</text>
      <rect x="8" y="50" width="60" height="2.5" fill="#bbb"/><rect x="8" y="55" width="48" height="2.5" fill="#bbb"/>
    </g>
    <g id="thumbCard3">
      <rect x="0" y="0" width="112" height="68" rx="6" fill="#FBFAF6"/>
      <circle cx="20" cy="18" r="7" fill="none" stroke="#B7791F" stroke-width="2"/>
      <text x="34" y="22" font-size="8" font-weight="600" fill="#5a4a1a">テスト物産</text>
      <text x="8" y="46" font-size="11" font-weight="700" fill="#222">佐藤 次郎</text>
      <rect x="8" y="54" width="56" height="2.5" fill="#bbb"/>
    </g>
    <g id="thumbCard4">
      <rect x="0" y="0" width="112" height="68" rx="6" fill="#fff"/>
      <rect x="104" y="0" width="8" height="68" fill="#718096"/>
      <text x="8" y="18" font-size="8" font-weight="600" fill="#2d3748">株式会社デモ</text>
      <text x="8" y="44" font-size="11" font-weight="700" fill="#222">高橋 一美</text>
      <rect x="8" y="52" width="52" height="2.5" fill="#bbb"/>
    </g>
    <g id="thumbCard5">
      <rect x="0" y="0" width="112" height="68" rx="6" fill="#fff"/>
      <rect x="0" y="63" width="112" height="5" fill="#0E7490"/>
      <text x="8" y="15" font-size="7.5" font-weight="600" fill="#164E63">サンプル工業株式会社</text>
      <text x="8" y="42" font-size="11" font-weight="700" fill="#222">田中 三郎</text>
      <rect x="8" y="50" width="58" height="2.5" fill="#bbb"/><rect x="8" y="55" width="44" height="2.5" fill="#bbb"/>
    </g>
    <clipPath id="listClip"><rect x="8" y="232" width="386" height="634" rx="12"/></clipPath>
  </defs>

  <style>
    .anim { animation-duration: 8s; animation-iteration-count: infinite; animation-timing-function: linear; }
    /* 一覧行の出現(基底=表示) */
    .row { opacity: 1; transform: translateY(0); animation-name: k-row; }
    .r2 { animation-name: k-row2; } .r3 { animation-name: k-row3; } .r4 { animation-name: k-row4; }
    @keyframes k-row {
      0% { opacity: 0; transform: translateY(14px); } 25% { opacity: 0; transform: translateY(14px); }
      30% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes k-row2 {
      0% { opacity: 0; transform: translateY(14px); } 28% { opacity: 0; transform: translateY(14px); }
      33% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes k-row3 {
      0% { opacity: 0; transform: translateY(14px); } 31% { opacity: 0; transform: translateY(14px); }
      36% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes k-row4 {
      0% { opacity: 0; transform: translateY(14px); } 34% { opacity: 0; transform: translateY(14px); }
      39% { opacity: 1; transform: translateY(0); } 100% { opacity: 1; transform: translateY(0); }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
    }
  </style>

  <!-- 名刺管理(一覧) -->
  <g>
    <rect width="402" height="874" fill="#F3F4F6"/>
    <!-- ヘッダー -->
    <rect x="0" y="55" width="402" height="68" fill="#fff"/>
    <use href="#jpakuLogo" transform="translate(12 73) scale(.152)"/>
    <text x="108" y="95" font-size="12" font-weight="700" fill="#000">名刺管理</text>
    <!-- edit / description / menu アイコン -->
    <g fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M296 99 l3 -10 l14 -14 l7 7 l-14 14 Z M310 78 l7 7"/>
      <g>
        <path d="M336 76 h12 l6 6 v18 h-18 Z"/>
        <path d="M348 76 v6 h6 M340 88 h10 M340 94 h10"/>
      </g>
      <path d="M370 80 h22 M370 89 h22 M370 98 h22"/>
    </g>
    <rect x="0" y="123" width="402" height="10" fill="#D1D5DB"/>

    <!-- 得意先選択ボックス(全件) -->
    <rect x="8" y="141" width="386" height="56" rx="12" fill="#fff" stroke="#D1D5DB" filter="url(#softShadow)"/>
    <path d="M30 155 a10 10 0 0 1 10 10 c0 7 -10 16 -10 16 s-10 -9 -10 -16 a10 10 0 0 1 10 -10 Z" fill="#F87171"/>
    <circle cx="30" cy="165" r="3.8" fill="#fff"/>
    <text x="56" y="175" font-size="16" font-weight="700" fill="#111">全件</text>

    <!-- 自分フィルタ -->
    <rect x="20" y="206" width="16" height="16" rx="3.5" fill="#2563EB"/>
    <path d="M23.5 214 l3.5 3.6 l6 -7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="42" y="219" font-size="14" fill="#111">自分</text>

    <!-- 一覧カード -->
    <rect x="8" y="232" width="386" height="634" rx="12" fill="#fff" filter="url(#softShadow)"/>
    <g clip-path="url(#listClip)">
      <!-- 検索バー -->
      <rect x="20" y="244" width="362" height="40" rx="12" fill="#fff" stroke="#E5E7EB"/>
      <circle cx="38" cy="263" r="5.5" fill="none" stroke="#9CA3AF" stroke-width="2"/>
      <path d="M42.5 267.5 l4 4" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
      <text x="54" y="269" font-size="15" fill="#9CA3AF">キーワードで検索</text>
      <rect x="8" y="290" width="386" height="1" fill="#F3F4F6"/>

      <!-- 行1: 自分の登録(黄色ハイライト) -->
      <g class="anim row">
        <rect x="8" y="291" width="386" height="118" fill="#FFFFDD"/>
        <g transform="translate(20 303)" filter="url(#thumbShadow)"><use href="#thumbCard1"/></g>
        <rect x="20" y="379" width="120" height="17" rx="5" fill="#EAF3FF"/>
        <text x="26" y="391" font-size="9" fill="#4B77A8">更新日</text>
        <text x="56" y="391" font-size="9" font-weight="600" fill="#376A9F">2026.08.14</text>
        <rect x="108" y="381" width="27" height="13" rx="6.5" fill="#558ED5"/>
        <text x="121.5" y="391" font-size="9" fill="#fff" text-anchor="middle">今日</text>
        <text x="148" y="317" font-size="14" font-weight="700" fill="#111">山田 太郎</text>
        <text x="148" y="334" font-size="12" fill="#6B7280">(ヤマダ タロウ)</text>
        <text x="148" y="350" font-size="12" fill="#6B7280">課長</text>
        <text x="148" y="366" font-size="12" fill="#374151">株式会社サンプル</text>
        <text x="148" y="382" font-size="12" fill="#6B7280">090-0000-0000</text>
        <text x="148" y="398" font-size="12" fill="#9CA3AF">t.yamada@example.co.jp</text>
        <rect x="8" y="409" width="386" height="1" fill="#F3F4F6"/>
      </g>

      <!-- 行2 -->
      <g class="anim row r2">
        <g transform="translate(20 422)" filter="url(#thumbShadow)"><use href="#thumbCard2"/></g>
        <rect x="20" y="498" width="94" height="17" rx="5" fill="#EAF3FF"/>
        <text x="26" y="510" font-size="9" fill="#4B77A8">更新日</text>
        <text x="56" y="510" font-size="9" font-weight="600" fill="#376A9F">2026.08.01</text>
        <text x="148" y="436" font-size="14" font-weight="700" fill="#111">鈴木 花子</text>
        <text x="148" y="453" font-size="12" fill="#6B7280">(スズキ ハナコ)</text>
        <text x="148" y="469" font-size="12" fill="#6B7280">部長</text>
        <text x="148" y="485" font-size="12" fill="#374151">見本工業株式会社</text>
        <text x="148" y="501" font-size="12" fill="#6B7280">03-0000-0002</text>
        <text x="148" y="517" font-size="12" fill="#9CA3AF">h.suzuki@example.jp</text>
        <rect x="8" y="528" width="386" height="1" fill="#F3F4F6"/>
      </g>

      <!-- 行3 -->
      <g class="anim row r3">
        <g transform="translate(20 541)" filter="url(#thumbShadow)"><use href="#thumbCard3"/></g>
        <rect x="20" y="617" width="94" height="17" rx="5" fill="#EAF3FF"/>
        <text x="26" y="629" font-size="9" fill="#4B77A8">更新日</text>
        <text x="56" y="629" font-size="9" font-weight="600" fill="#376A9F">2026.07.25</text>
        <text x="148" y="555" font-size="14" font-weight="700" fill="#111">佐藤 次郎</text>
        <text x="148" y="572" font-size="12" fill="#6B7280">(サトウ ジロウ)</text>
        <text x="148" y="588" font-size="12" fill="#6B7280">主任</text>
        <text x="148" y="604" font-size="12" fill="#374151">テスト物産株式会社</text>
        <text x="148" y="620" font-size="12" fill="#6B7280">06-0000-0003</text>
        <text x="148" y="636" font-size="12" fill="#9CA3AF">j.sato@example.org</text>
        <rect x="8" y="647" width="386" height="1" fill="#F3F4F6"/>
      </g>

      <!-- 行4 -->
      <g class="anim row r4">
        <g transform="translate(20 660)" filter="url(#thumbShadow)"><use href="#thumbCard4"/></g>
        <rect x="20" y="736" width="94" height="17" rx="5" fill="#EAF3FF"/>
        <text x="26" y="748" font-size="9" fill="#4B77A8">更新日</text>
        <text x="56" y="748" font-size="9" font-weight="600" fill="#376A9F">2026.07.18</text>
        <text x="148" y="674" font-size="14" font-weight="700" fill="#111">高橋 一美</text>
        <text x="148" y="691" font-size="12" fill="#6B7280">(タカハシ カズミ)</text>
        <text x="148" y="707" font-size="12" fill="#6B7280">係長</text>
        <text x="148" y="723" font-size="12" fill="#374151">株式会社デモ</text>
        <text x="148" y="739" font-size="12" fill="#6B7280">090-0000-0001</text>
        <text x="148" y="755" font-size="12" fill="#9CA3AF">k.takahashi@example.jp</text>
        <rect x="8" y="766" width="386" height="1" fill="#F3F4F6"/>
      </g>

      <!-- 行5(下端で切れる) -->
      <g class="anim row r4">
        <g transform="translate(20 779)" filter="url(#thumbShadow)"><use href="#thumbCard5"/></g>
        <text x="148" y="793" font-size="14" font-weight="700" fill="#111">田中 三郎</text>
        <text x="148" y="810" font-size="12" fill="#6B7280">(タナカ サブロウ)</text>
        <text x="148" y="826" font-size="12" fill="#374151">サンプル工業株式会社</text>
        <text x="148" y="842" font-size="12" fill="#6B7280">045-000-0004</text>
      </g>
    </g>

    <!-- ステータスバー -->
    <g fill="#000">
      <text x="55" y="38" font-size="15" font-weight="600" text-anchor="middle">9:41</text>
      <g transform="translate(298 26)">
        <rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="6" width="3" height="6" rx=".8"/><rect x="10" y="4" width="3" height="8" rx=".8"/><rect x="15" y="2" width="3" height="10" rx=".8"/>
        <path d="M31 5.5 a9 9 0 0 1 12 0 l-1.8 2 a6.3 6.3 0 0 0 -8.4 0 Z M33.8 8.6 a5 5 0 0 1 6.4 0 l-1.8 2 a2.4 2.4 0 0 0 -2.8 0 Z M36.2 11.4 a1.6 1.6 0 0 1 1.6 0 L37 12.6 Z"/>
        <rect x="50" y="2.5" width="22" height="10" rx="3" fill="none" stroke="#000" stroke-opacity=".4"/>
        <rect x="52" y="4.5" width="14" height="6" rx="1.5"/>
        <path d="M73.5 5.5 v4 a2.2 2.2 0 0 0 0 -4" fill="#000" fill-opacity=".4"/>
      </g>
    </g>
  </g>
</svg>
