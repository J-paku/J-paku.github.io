<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif">
  <!-- 得意先一覧(Web管理画面): 住所を緯度経度に変換し現在地からの距離を算出。行が順次出現→距離バッジが確定するループ -->
  <defs>
    <filter id="softShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="3" flood-color="#000" flood-opacity=".12"/>
    </filter>
    <clipPath id="listClip"><rect x="8" y="232" width="386" height="634" rx="12"/></clipPath>
  </defs>

  <style>
    .anim { animation-duration: 6s; animation-iteration-count: infinite; animation-timing-function: linear; }
    /* 得意先行: 順次スライドイン→保持→フェードアウト(基底=表示。reduced-motionは全行表示の完成画で止める) */
    .row1 { opacity: 1; transform: translateY(0); animation-name: k-row1; }
    .row2 { opacity: 1; transform: translateY(0); animation-name: k-row2; }
    .row3 { opacity: 1; transform: translateY(0); animation-name: k-row3; }
    .row4 { opacity: 1; transform: translateY(0); animation-name: k-row4; }
    @keyframes k-row1 {
      0% { opacity: 0; transform: translateY(14px); } 6% { opacity: 0; transform: translateY(14px); }
      12% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; transform: translateY(0); }
      94% { opacity: 0; transform: translateY(14px); } 100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes k-row2 {
      0% { opacity: 0; transform: translateY(14px); } 10% { opacity: 0; transform: translateY(14px); }
      16% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; transform: translateY(0); }
      94% { opacity: 0; transform: translateY(14px); } 100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes k-row3 {
      0% { opacity: 0; transform: translateY(14px); } 14% { opacity: 0; transform: translateY(14px); }
      20% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; transform: translateY(0); }
      94% { opacity: 0; transform: translateY(14px); } 100% { opacity: 0; transform: translateY(14px); }
    }
    @keyframes k-row4 {
      0% { opacity: 0; transform: translateY(14px); } 18% { opacity: 0; transform: translateY(14px); }
      24% { opacity: 1; transform: translateY(0); } 88% { opacity: 1; transform: translateY(0); }
      94% { opacity: 0; transform: translateY(14px); } 100% { opacity: 0; transform: translateY(14px); }
    }
    /* 距離バッジ確定(行より少し遅れてポップ表示。基底=表示) */
    .badge1, .badge2, .badge3, .badge4 { transform-box: fill-box; transform-origin: center; }
    .badge1 { opacity: 1; transform: scale(1); animation-name: k-badge1; }
    .badge2 { opacity: 1; transform: scale(1); animation-name: k-badge2; }
    .badge3 { opacity: 1; transform: scale(1); animation-name: k-badge3; }
    .badge4 { opacity: 1; transform: scale(1); animation-name: k-badge4; }
    @keyframes k-badge1 {
      0% { opacity: 0; transform: scale(.8); } 18% { opacity: 0; transform: scale(.8); }
      24% { opacity: 1; transform: scale(1.08); } 28% { opacity: 1; transform: scale(1); }
      88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(.8); }
      100% { opacity: 0; transform: scale(.8); }
    }
    @keyframes k-badge2 {
      0% { opacity: 0; transform: scale(.8); } 22% { opacity: 0; transform: scale(.8); }
      28% { opacity: 1; transform: scale(1.08); } 32% { opacity: 1; transform: scale(1); }
      88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(.8); }
      100% { opacity: 0; transform: scale(.8); }
    }
    @keyframes k-badge3 {
      0% { opacity: 0; transform: scale(.8); } 26% { opacity: 0; transform: scale(.8); }
      32% { opacity: 1; transform: scale(1.08); } 36% { opacity: 1; transform: scale(1); }
      88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(.8); }
      100% { opacity: 0; transform: scale(.8); }
    }
    @keyframes k-badge4 {
      0% { opacity: 0; transform: scale(.8); } 30% { opacity: 0; transform: scale(.8); }
      36% { opacity: 1; transform: scale(1.08); } 40% { opacity: 1; transform: scale(1); }
      88% { opacity: 1; transform: scale(1); } 94% { opacity: 0; transform: scale(.8); }
      100% { opacity: 0; transform: scale(.8); }
    }
    /* 現在地パルス(独立ループ。基底=薄いリング) */
    .pulse { transform-box: fill-box; transform-origin: center; opacity: .35; animation: k-pulse 2s ease-out infinite; }
    @keyframes k-pulse {
      0% { transform: scale(1); opacity: .45; } 100% { transform: scale(2.6); opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim, .pulse { animation: none !important; }
    }
  </style>

  <!-- 背景(systemGroupedBackground相当) -->
  <rect width="402" height="874" fill="#F3F4F6"/>

  <!-- ステータスバー -->
  <g fill="#000">
    <text x="55" y="38" font-size="15" font-weight="600" text-anchor="middle">9:41</text>
    <g transform="translate(298 26)">
      <rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="6" width="3" height="6" rx=".8"/><rect x="10" y="4" width="3" height="8" rx=".8"/><rect x="15" y="2" width="3" height="10" rx=".8"/>
      <path d="M31 5.5 a9 9 0 0 1 12 0 l-1.8 2 a6.3 6.3 0 0 0 -8.4 0 Z M33.8 8.6 a5 5 0 0 1 6.4 0 l-1.8 2 a2.4 2.4 0 0 0 -2.8 0 Z M36.2 11.4 a1.6 1.6 0 0 1 1.6 0 L37 12.6 Z"/>
      <rect x="50" y="2.5" width="22" height="10" rx="3" fill="none" stroke="#000" stroke-opacity=".4"/>
      <rect x="52" y="4.5" width="14" height="6" rx="1.5"/>
      <path d="M73.5 5.5 v4 a2.2 2.2 0 0 0 0 -4" fill="#000" fill-opacity=".4"/>
    </g>
  </g>

  <!-- ヘッダー -->
  <rect x="0" y="55" width="402" height="68" fill="#fff"/>
  <rect x="20" y="72" width="34" height="34" rx="9" fill="#2563EB"/>
  <path d="M37 80 a8 8 0 0 1 8 8 c0 5.6 -8 12.8 -8 12.8 s-8 -7.2 -8 -12.8 a8 8 0 0 1 8 -8 Z" fill="#fff"/>
  <circle cx="37" cy="88" r="3" fill="#2563EB"/>
  <text x="66" y="95" font-size="19" font-weight="700" fill="#111">得意先一覧</text>
  <!-- 現在地更新アイコン -->
  <g transform="translate(362 89)" fill="none" stroke="#6B7280" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <circle r="10"/>
    <path d="M0 -14 v6 M0 8 v6 M-14 0 h6 M8 0 h6"/>
  </g>
  <rect x="0" y="123" width="402" height="10" fill="#D1D5DB"/>

  <!-- 現在地ボックス -->
  <rect x="8" y="141" width="386" height="56" rx="12" fill="#fff" stroke="#D1D5DB" filter="url(#softShadow)"/>
  <g transform="translate(30 169)">
    <circle class="pulse" r="8" fill="#2563EB"/>
    <circle r="8" fill="#2563EB" stroke="#fff" stroke-width="3"/>
  </g>
  <text x="54" y="162" font-size="11" fill="#9CA3AF">現在地</text>
  <text x="54" y="180" font-size="15" font-weight="700" fill="#111">東京都千代田区 付近</text>
  <circle cx="358" cy="169" r="11" fill="#34C759"/>
  <path d="M352.5 169 l3.6 3.8 l6.6 -7.2" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- 並び替え -->
  <rect x="20" y="206" width="16" height="16" rx="3.5" fill="#2563EB"/>
  <path d="M23.5 214 l3.5 3.6 l6 -7" stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="42" y="219" font-size="14" fill="#111">近い順に並び替え</text>

  <!-- 一覧カード -->
  <rect x="8" y="232" width="386" height="634" rx="12" fill="#fff" filter="url(#softShadow)"/>
  <g clip-path="url(#listClip)">
    <!-- 検索バー -->
    <rect x="20" y="244" width="362" height="40" rx="12" fill="#fff" stroke="#E5E7EB"/>
    <circle cx="38" cy="263" r="5.5" fill="none" stroke="#9CA3AF" stroke-width="2"/>
    <path d="M42.5 267.5 l4 4" stroke="#9CA3AF" stroke-width="2" stroke-linecap="round"/>
    <text x="54" y="269" font-size="15" fill="#9CA3AF">得意先名で検索</text>
    <rect x="8" y="290" width="386" height="1" fill="#F3F4F6"/>

    <!-- 行1: 株式会社サンプル -->
    <g class="anim row1">
      <path d="M30 305 a10 10 0 0 1 10 10 c0 7 -10 16 -10 16 s-10 -9 -10 -16 a10 10 0 0 1 10 -10 Z" fill="#F87171"/>
      <circle cx="30" cy="315" r="3.6" fill="#fff"/>
      <text x="58" y="321" font-size="16" font-weight="700" fill="#111">株式会社サンプル</text>
      <text x="58" y="343" font-size="12" fill="#6B7280">東京都千代田区見本町1-2-3</text>
      <rect x="8" y="434" width="386" height="1" fill="#F3F4F6"/>
    </g>
    <g class="anim badge1">
      <rect x="306" y="300" width="72" height="30" rx="15" fill="#2563EB"/>
      <text x="342" y="320" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">320m</text>
    </g>

    <!-- 行2: 見本工業株式会社 -->
    <g class="anim row2">
      <path d="M30 449 a10 10 0 0 1 10 10 c0 7 -10 16 -10 16 s-10 -9 -10 -16 a10 10 0 0 1 10 -10 Z" fill="#F87171"/>
      <circle cx="30" cy="459" r="3.6" fill="#fff"/>
      <text x="58" y="465" font-size="16" font-weight="700" fill="#111">見本工業株式会社</text>
      <text x="58" y="487" font-size="12" fill="#6B7280">東京都千代田区大手見本2-1</text>
      <rect x="8" y="578" width="386" height="1" fill="#F3F4F6"/>
    </g>
    <g class="anim badge2">
      <rect x="306" y="444" width="72" height="30" rx="15" fill="#2563EB"/>
      <text x="342" y="464" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">850m</text>
    </g>

    <!-- 行3: テスト物産株式会社 -->
    <g class="anim row3">
      <path d="M30 593 a10 10 0 0 1 10 10 c0 7 -10 16 -10 16 s-10 -9 -10 -16 a10 10 0 0 1 10 -10 Z" fill="#F87171"/>
      <circle cx="30" cy="603" r="3.6" fill="#fff"/>
      <text x="58" y="609" font-size="16" font-weight="700" fill="#111">テスト物産株式会社</text>
      <text x="58" y="631" font-size="12" fill="#6B7280">東京都中央区築地見本3-5</text>
      <rect x="8" y="722" width="386" height="1" fill="#F3F4F6"/>
    </g>
    <g class="anim badge3">
      <rect x="306" y="588" width="72" height="30" rx="15" fill="#2563EB"/>
      <text x="342" y="608" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">1.2km</text>
    </g>

    <!-- 行4: サンプル工業株式会社(下端) -->
    <g class="anim row4">
      <path d="M30 737 a10 10 0 0 1 10 10 c0 7 -10 16 -10 16 s-10 -9 -10 -16 a10 10 0 0 1 10 -10 Z" fill="#F87171"/>
      <circle cx="30" cy="747" r="3.6" fill="#fff"/>
      <text x="58" y="753" font-size="16" font-weight="700" fill="#111">サンプル工業株式会社</text>
      <text x="58" y="775" font-size="12" fill="#6B7280">東京都港区芝見本4-8-2</text>
    </g>
    <g class="anim badge4">
      <rect x="306" y="732" width="72" height="30" rx="15" fill="#2563EB"/>
      <text x="342" y="752" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">4.8km</text>
    </g>
  </g>
</svg>
