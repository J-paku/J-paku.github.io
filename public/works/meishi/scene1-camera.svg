<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 402 874" font-family="-apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Noto Sans JP', system-ui, sans-serif">
  <!-- 名刺撮影画面(表側 STEP1/2): 検出枠が名刺に吸い付き→進行リング→自動撮影フラッシュのループ -->
  <defs>
    <linearGradient id="banner" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2459F5"/>
      <stop offset="1" stop-color="#3894FF"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1c21"/>
      <stop offset=".55" stop-color="#111318"/>
      <stop offset="1" stop-color="#0b0c10"/>
    </linearGradient>
    <!-- 暗色六角タイル床(実撮影背景の再現) -->
    <pattern id="hex" width="56" height="97" patternUnits="userSpaceOnUse" patternTransform="scale(1.15) rotate(8)">
      <g fill="none" stroke="#262a33" stroke-width="1.4">
        <path d="M14 0 L42 0 L56 24.25 L42 48.5 L14 48.5 L0 24.25 Z"/>
        <path d="M42 48.5 L70 48.5 L84 72.75 L70 97 L42 97 L28 72.75 Z" transform="translate(-28 0)"/>
        <path d="M14 97 L42 97 L56 121.25" transform="translate(0 -0)"/>
      </g>
    </pattern>
    <radialGradient id="vig" cx=".5" cy=".52" r=".75">
      <stop offset=".55" stop-color="#000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".55"/>
    </radialGradient>
    <filter id="cardShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity=".5"/>
    </filter>
    <!-- 撮影対象のダミー名刺(架空データ) -->
    <g id="dummyCard">
      <rect x="-150" y="-91" width="300" height="182" rx="3" fill="#ffffff"/>
      <rect x="-150" y="83" width="300" height="8" fill="#4A5FC1"/>
      <circle cx="-128" cy="-68" r="8" fill="none" stroke="#4A5FC1" stroke-width="2.5"/>
      <circle cx="-128" cy="-68" r="3" fill="#4A5FC1"/>
      <text x="-112" y="-63" font-size="14" font-weight="600" fill="#1a2b4a">株式会社サンプル</text>
      <text x="-128" y="-40" font-size="8.5" fill="#555">営業部 営業一課</text>
      <text x="-128" y="6" font-size="24" font-weight="700" letter-spacing="4" fill="#111">山田 太郎</text>
      <text x="-128" y="24" font-size="7.5" letter-spacing="2.5" fill="#888">YAMADA TARO</text>
      <text x="8" y="30" font-size="7" fill="#444">〒100-0000 東京都千代田区見本町1-2-3</text>
      <text x="8" y="42" font-size="7" fill="#444">TEL: 03-0000-0000　携帯: 090-0000-0000</text>
      <text x="8" y="54" font-size="7" fill="#444">E-mail: t.yamada@example.co.jp</text>
      <text x="8" y="66" font-size="7" fill="#444">URL: https://www.example.co.jp</text>
    </g>
  </defs>

  <style>
    .anim { animation-duration: 7s; animation-iteration-count: infinite; animation-timing-function: linear; }
    /* 探索中UI(基底=非表示: reduced-motion時は安定状態の画で止める) */
    .search { opacity: 0; animation-name: k-search; }
    @keyframes k-search {
      0% { opacity: 1; } 16% { opacity: 1; } 20% { opacity: 0; }
      88% { opacity: 0; } 94% { opacity: 1; } 100% { opacity: 1; }
    }
    /* 安定検出UI(緑枠・リング・ピル) 基底=表示 */
    .lock { opacity: 1; animation-name: k-lock; }
    @keyframes k-lock {
      0% { opacity: 0; } 16% { opacity: 0; } 20% { opacity: 1; }
      78% { opacity: 1; } 84% { opacity: 0; } 100% { opacity: 0; }
    }
    /* 検出枠スナップ(外側から吸い付く) */
    .snap { transform-box: fill-box; transform-origin: center; animation-name: k-snap; }
    @keyframes k-snap {
      0% { transform: scale(1.12) rotate(1.5deg); } 16% { transform: scale(1.12) rotate(1.5deg); }
      23% { transform: scale(1) rotate(0deg); } 100% { transform: scale(1) rotate(0deg); }
    }
    /* 名刺のわずかな手ぶれ */
    .drift { transform-box: fill-box; transform-origin: center; animation-name: k-drift; }
    @keyframes k-drift {
      0% { transform: translate(4px, 3px) rotate(-.6deg); }
      10% { transform: translate(-3px, 1px) rotate(.4deg); }
      19% { transform: translate(0, 0) rotate(0deg); }
      90% { transform: translate(0, 0) rotate(0deg); }
      100% { transform: translate(4px, 3px) rotate(-.6deg); }
    }
    /* 進行リング: 基底=65%(静止画で意味が通る) */
    .ring { stroke-dasharray: 251.4; stroke-dashoffset: 88; animation-name: k-ring; }
    @keyframes k-ring {
      0% { stroke-dashoffset: 251.4; } 20% { stroke-dashoffset: 251.4; }
      56% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 0; }
    }
    /* 自動撮影フラッシュ */
    .flash { opacity: 0; animation-name: k-flash; }
    @keyframes k-flash {
      0% { opacity: 0; } 56% { opacity: 0; } 58% { opacity: .85; }
      63% { opacity: 0; } 100% { opacity: 0; }
    }
    @media (prefers-reduced-motion: reduce) {
      .anim { animation: none !important; }
    }
  </style>

  <!-- 背景(カメラ映像: 暗色床) -->
  <rect width="402" height="874" fill="url(#floor)"/>
  <rect width="402" height="874" fill="url(#hex)" opacity=".8"/>
  <rect width="402" height="874" fill="url(#vig)"/>

  <!-- ステータスバー -->
  <g fill="#fff">
    <text x="55" y="38" font-size="15" font-weight="600" text-anchor="middle">9:41</text>
    <g transform="translate(298 26)">
      <rect x="0" y="8" width="3" height="4" rx=".8"/><rect x="5" y="6" width="3" height="6" rx=".8"/><rect x="10" y="4" width="3" height="8" rx=".8"/><rect x="15" y="2" width="3" height="10" rx=".8"/>
      <path d="M31 5.5 a9 9 0 0 1 12 0 l-1.8 2 a6.3 6.3 0 0 0 -8.4 0 Z M33.8 8.6 a5 5 0 0 1 6.4 0 l-1.8 2 a2.4 2.4 0 0 0 -2.8 0 Z M36.2 11.4 a1.6 1.6 0 0 1 1.6 0 L37 12.6 Z"/>
      <rect x="50" y="2.5" width="22" height="10" rx="3" fill="none" stroke="#fff" stroke-opacity=".5"/>
      <rect x="52" y="4.5" width="14" height="6" rx="1.5"/>
      <path d="M73.5 5.5 v4 a2.2 2.2 0 0 0 0 -4" fill="#fff" fill-opacity=".5"/>
    </g>
  </g>

  <!-- 名刺(手ぶれ) -->
  <g class="anim drift">
    <g transform="translate(201 452) rotate(-3)" filter="url(#cardShadow)">
      <use href="#dummyCard"/>
    </g>
  </g>

  <!-- 検出枠(安定=緑) -->
  <g class="anim lock">
    <g class="anim snap">
      <rect x="43" y="355" width="316" height="198" rx="5" fill="none" stroke="#34C759" stroke-width="3" transform="rotate(-3 201 452)"/>
    </g>
  </g>

  <!-- 進行リング + カメラアイコン -->
  <g class="anim lock">
    <circle cx="201" cy="452" r="40" fill="none" stroke="#ffffff" stroke-opacity=".15" stroke-width="6"/>
    <circle class="anim ring" cx="201" cy="452" r="40" fill="none" stroke="#34C759" stroke-width="6" stroke-linecap="round" transform="rotate(-90 201 452)"/>
    <g fill="#fff">
      <rect x="188" y="444" width="26" height="18" rx="4"/>
      <path d="M196 444 l2.5 -4 h5 l2.5 4 Z"/>
      <circle cx="201" cy="453" r="5.5" fill="#34C759" stroke="#fff" stroke-width="2.4"/>
    </g>
  </g>

  <!-- 上部ステップバナー(表側 STEP1/2) -->
  <g>
    <rect x="16" y="62" width="370" height="96" rx="18" fill="url(#banner)" stroke="#ffffff" stroke-opacity=".14"/>
    <circle cx="38" cy="88" r="4.5" fill="#fff"/>
    <rect x="47" y="86.5" width="34" height="3" rx="1.5" fill="#fff" opacity=".45"/>
    <circle cx="90" cy="88" r="4.5" fill="#fff" opacity=".4"/>
    <text x="34" y="126" font-size="22" font-weight="700" fill="#fff">表側を撮影</text>
    <text x="34" y="148" font-size="13" font-weight="600" letter-spacing="2" fill="#fff" opacity=".9">STEP 1 / 2</text>
    <!-- ? / ✕ ボタン -->
    <g>
      <circle cx="294" cy="98" r="20" fill="#15171c" opacity=".45"/>
      <text x="294" y="104" font-size="16" font-weight="700" fill="#fff" opacity=".92" text-anchor="middle">?</text>
      <circle cx="346" cy="98" r="20" fill="#15171c" opacity=".45"/>
      <path d="M340 92 l12 12 M352 92 l-12 12" stroke="#fff" stroke-opacity=".92" stroke-width="2.4" stroke-linecap="round"/>
    </g>
  </g>

  <!-- 状態ピル: 探索中 -->
  <g class="anim search">
    <g transform="translate(201 614)">
      <rect x="-136" y="-21" width="272" height="42" rx="21" fill="#1b1d23" opacity=".78"/>
      <rect x="-136" y="-21" width="272" height="42" rx="21" fill="none" stroke="#fff" stroke-opacity=".15"/>
      <!-- viewfinder アイコン -->
      <g stroke="#fff" stroke-width="2" fill="none" stroke-linecap="round">
        <path d="M-122 -7 v-4 a3 3 0 0 1 3 -3 h4 M-108 -14 h4 a3 3 0 0 1 3 3 v4 M-101 3 v4 a3 3 0 0 1 -3 3 h-4 M-115 10 h-4 a3 3 0 0 1 -3 -3 v-4"/>
      </g>
      <text x="-92" y="5" font-size="14" font-weight="600" fill="#fff">名刺をかざすか、タップして認識</text>
    </g>
    <text x="201" y="662" font-size="13" font-weight="600" fill="#fff" opacity=".88" text-anchor="middle">15cmほど離して撮影</text>
  </g>

  <!-- 状態ピル: 自動撮影 -->
  <g class="anim lock">
    <g transform="translate(201 614)">
      <rect x="-92" y="-21" width="184" height="42" rx="21" fill="#1b1d23" opacity=".78"/>
      <rect x="-92" y="-21" width="184" height="42" rx="21" fill="none" stroke="#fff" stroke-opacity=".15"/>
      <circle cx="-68" cy="0" r="9" fill="#34C759"/>
      <path d="M-72.5 0 l3.2 3.4 l6 -6.6" stroke="#fff" stroke-width="2.2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="-52" y="5" font-size="14" font-weight="600" fill="#fff">自動撮影します</text>
    </g>
  </g>

  <!-- 下部: 写真から選択 / ライト -->
  <g>
    <circle cx="52" cy="792" r="24" fill="#15171c" opacity=".5"/>
    <g transform="translate(52 792)" fill="#fff" opacity=".9">
      <rect x="-9" y="-4" width="18" height="13" rx="2.5"/>
      <path d="M-7 -7 h14 M-5 -10 h10" stroke="#fff" stroke-width="2" stroke-linecap="round" fill="none" opacity=".8"/>
    </g>
    <circle cx="350" cy="792" r="24" fill="#15171c" opacity=".5"/>
    <g transform="translate(350 792)" fill="#fff" opacity=".9">
      <path d="M-4 -10 h8 v4 l-2.5 3 v13 h-3 v-13 l-2.5 -3 Z"/>
      <circle cx="0" cy="-1" r="1" fill="#15171c"/>
    </g>
  </g>

  <!-- 撮影フラッシュ -->
  <rect class="anim flash" width="402" height="874" fill="#fff"/>
</svg>
